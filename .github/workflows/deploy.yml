name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  # content repo dispatches this after a push (see A9)
  repository_dispatch:
    types: [content-updated]
  # manual build; pass an old content SHA to rebuild a previous content revision
  workflow_dispatch:
    inputs:
      content_ref:
        description: "Content repo ref or commit SHA (empty = main)"
        required: false
        default: ""
  # NOTE: GitHub disables scheduled workflows on forks. Kept as intent; do not rely on it.
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTENT_REPOSITORY: Loadcha/shirone-content
  CONTENT_WORKING_COPY: .content-src
  DEPLOY_BASE: /loadcha/30_developing/chaloacc
  KEEP_RELEASES: "2"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      # switch content:sync to "local directory" mode; content is checked out below
      CONTENT_DIR: .content-src

    steps:
      - name: Resolve content ref
        id: target
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: |
          set -euo pipefail
          echo "sha=$(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore thumbnail cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/assets/moments/thumbnails
          key: ${{ runner.os }}-shirone-thumbnails-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-thumbnails-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Materialize content and config
        run: pnpm content:sync

      - name: Restore anime cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            src/data/anime-snapshots
            public/assets/anime/covers
          key: ${{ runner.os }}-shirone-anime-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-anime-

      - name: Sync anime data (best effort)
        run: pnpm anime:sync --if-stale
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Build site
        run: pnpm build
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Package release
        id: pkg
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pkg="dist-${stamp}-${GITHUB_SHA::7}.tar.gz"
          tar -czf "$pkg" -C dist .
          sha="$(sha256sum "$pkg" | cut -d' ' -f1)"
          {
            echo "stamp=$stamp"
            echo "pkg=$pkg"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "packaged $pkg ($sha)"

      - name: Deploy to device chaloa
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          STAMP: ${{ steps.pkg.outputs.stamp }}
          PKG: ${{ steps.pkg.outputs.pkg }}
          PKG_SHA: ${{ steps.pkg.outputs.sha }}
          THEME_SHA: ${{ github.sha }}
          CONTENT_SHA: ${{ steps.content.outputs.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT")
          SCP_OPTS=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT")
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          ssh "${SSH_OPTS[@]}" "$TARGET" "install -d -m 755 '$DEPLOY_BASE/incoming'"
          prev="$(ssh "${SSH_OPTS[@]}" "$TARGET" "readlink '$DEPLOY_BASE/current' 2>/dev/null | sed 's#^releases/##'" || true)"
          scp "${SCP_OPTS[@]}" "$PKG" "$TARGET:$DEPLOY_BASE/incoming/$PKG"
          ssh "${SSH_OPTS[@]}" "$TARGET" \
            "bash '$DEPLOY_BASE/bin/release.sh' '$STAMP' '$PKG' '$PKG_SHA' '$THEME_SHA' '$CONTENT_SHA' '$KEEP_RELEASES'"
          echo "${prev:-none}" > ./.previous_release
          echo "$STAMP" > ./.deployed_stamp

          # on-host truth: `current` must point at the release we just published
          ssh "${SSH_OPTS[@]}" "$TARGET" "readlink '$DEPLOY_BASE/current' | grep -qx 'releases/$STAMP'"

          # Public verification only makes sense once the static vhost is live (P4).
          # Before cutover nginx still proxies to the tunnel, which does not serve release.json,
          # so strict HTTPS checks here would fail for the wrong reason.
          if ssh "${SSH_OPTS[@]}" "$TARGET" "grep -q 'root $DEPLOY_BASE/current;' /etc/nginx/sites-available/shirone"; then
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 10 https://chaloa.cc/release.json -o /tmp/release.json; then ok=1; break; fi
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "E: release.json not reachable over HTTPS" >&2; exit 1; }
            cat /tmp/release.json
            jq -e --arg c "$CONTENT_SHA" '.content_sha == $c' /tmp/release.json > /dev/null
            curl -fsS --max-time 10 https://chaloa.cc/ | grep -q "<title>"
            curl -fsS --max-time 10 -o /dev/null -w 'rss=%{http_code}\n' https://chaloa.cc/rss.xml
            echo "OK: release $STAMP is live and publicly verified"
          else
            echo "OK: release $STAMP staged at $DEPLOY_BASE/current (vhost still proxying; cut over in P4 to serve it)"
          fi

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"; chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          # Only roll back if this run actually flipped `current`; otherwise a failure earlier in the
          # pipeline would revert a *healthy* site to an older release.
          if [ ! -f ./.deployed_stamp ]; then
            echo "no release switch happened in this run; nothing to roll back"
            exit 0
          fi
          prev="$(cat ./.previous_release 2>/dev/null || echo none)"
          if [ -z "$prev" ] || [ "$prev" = "none" ]; then
            echo "no previous release recorded; manual intervention required (see §9)" >&2
            exit 0
          fi
          echo "rolling back to releases/$prev"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash '$DEPLOY_BASE/bin/rollback.sh' '$prev'" || true
          curl -fsS --max-time 10 https://chaloa.cc/release.json || true

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- content repo: \`${CONTENT_REPOSITORY}\`"
            echo "- content ref: \`${{ steps.target.outputs.ref }}\`"
            echo "- theme commit: \`${{ github.sha }}\`"
            echo "- content commit: \`${{ steps.content.outputs.sha }}\`"
            echo "- release stamp: \`${{ steps.pkg.outputs.stamp }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
